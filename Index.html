<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e1015">
    <meta name="description" content="Aviator Pro - Jogo do Aviaozinho com Fichas Virtuais">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aviator Pro">
    <title>Aviator Pro - Virtual Cash</title>

    <style>
        /* --- ESTILOS GERAIS E TEMA HIGH-TECH --- */
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151a23;
            --bg-input: #1f2633;
            --red-primary: #ff0055;
            --red-hover: #d60047;
            --green-cashout: #00e676;
            --green-hover: #00c853;
            --yellow-accent: #ffb300;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3447;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- TELA DE AUTENTICAÇÃO --- */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e050d 0%, #0b0e14 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(255, 0, 85, 0.15);
            text-align: center;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #ff0055, #80002a);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
        }

        .auth-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-input);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-tab.active {
            background: var(--red-primary);
            color: white;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--red-primary);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff0055, #ff3300);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: 0.2s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* --- INTERFACE DO JOGO --- */
        #app-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 18px;
            color: var(--red-primary);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-badge {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--green-cashout);
        }

        .btn-deposit {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* HISTÓRICO */
        .history-bar {
            background: #090b0e;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .history-bar::-webkit-scrollbar { display: none; }

        .history-item {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            animation: fadeIn 0.4s ease;
        }
        .h-blue { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .h-purple { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }
        .h-gold { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid #eab308; }

        /* CANVA DO AVIÃO */
        .game-display {
            position: relative;
            flex: 1;
            min-height: 320px;
            background: radial-gradient(circle at 10% 90%, #1a0810 0%, #0b0e14 70%);
            margin: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .multiplier-text {
            font-size: 64px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            line-height: 1;
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* PAINEL DE CONTROLES */
        .controls-container {
            padding: 0 12px 12px 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .controls-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .bet-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-inputs {
            display: flex;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .input-box label {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 800;
            outline: none;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn-q {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-q:hover { background: #2a3447; }

        .btn-main-action {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .btn-bet { background: linear-gradient(180deg, #ff0055, #c40041); color: white; }
        .btn-cashout { background: linear-gradient(180deg, #00e676, #00ab55); color: #003b19; }
        .btn-waiting { background: #334155; color: #94a3b8; cursor: not-allowed; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="white">
                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
            </div>
            <h1 class="auth-title">AVIATOR PRO</h1>
            <p class="auth-subtitle">Simulador de Apostas com Fichas Virtuais</p>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Entrar</button>
                <button class="auth-tab" id="tab-register" onclick="switchAuthMode('register')">Cadastrar</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="auth-email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="auth-btn-text">ENTRAR NO JOGO</button>
            </form>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO JOGO -->
    <div id="app-screen">
        <header>
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
                AVIATOR
            </div>
            <div class="user-panel">
                <div class="balance-badge">
                    <span>🪙</span>
                    <span id="user-balance">0.00</span>
                </div>
                <button class="btn-deposit" onclick="addDemoFunds()">+ Fichas</button>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </header>

        <!-- HISTÓRICO DE MULTIPLICADORES -->
        <div class="history-bar" id="history-bar">
            <!-- Inserido dinamicamente -->
        </div>

        <!-- CANVAS DE ANIMAÇÃO -->
        <div class="game-display">
            <canvas id="game-canvas"></canvas>
            <div class="multiplier-overlay">
                <div class="multiplier-text" id="multiplier-display">1.00x</div>
                <div class="status-text" id="status-display">AGUARDANDO PRÓXIMA RODADA...</div>
            </div>
        </div>

        <!-- PAINEL DE APOSTA -->
        <div class="controls-container">
            <div class="bet-card">
                <div class="bet-inputs">
                    <div class="input-box">
                        <label>Valor da Aposta (Fichas)</label>
                        <input type="number" id="bet-amount" value="10" min="1" step="1">
                    </div>
                    <div class="input-box">
                        <label>Auto Cash Out</label>
                        <input type="number" id="auto-cashout" placeholder="Ex: 2.00" step="0.1" min="1.1">
                    </div>
                </div>

                <div class="quick-buttons">
                    <button class="btn-q" onclick="adjustBet(5)">+5</button>
                    <button class="btn-q" onclick="adjustBet(10)">+10</button>
                    <button class="btn-q" onclick="adjustBet(50)">+50</button>
                    <button class="btn-q" onclick="multiplyBet(2)">2x</button>
                </div>

                <button id="btn-action" class="btn-main-action btn-bet" onclick="handleMainAction()">APOSTAR</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DO SISTEMA, PWA E REGRAS DE NEGÓCIO -->
    <script>
        /* --- CONFIGURAÇÕES DE PWA E MANIFEST DINÂMICO --- */
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff0055"/>
                    <stop offset="100%" stop-color="#660022"/>
                </linearGradient>
            </defs>
            <rect width="512" height="512" rx="100" fill="url(#bg)"/>
            <path d="M430 230 L290 190 L190 70 C180 60 160 60 155 75 L140 120 L220 200 L120 230 L70 190 L40 200 L80 260 L40 320 L70 330 L120 290 L220 320 L140 400 L155 445 C160 460 180 460 190 450 L290 330 L430 290 C460 280 460 240 430 230 Z" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))"/>
        </svg>`;

        const iconDataUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

        // Injetar Favicon
        const favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.href = iconDataUrl;
        document.head.appendChild(favicon);

        // Injetar Manifest PWA
        const manifestObj = {
            name: "Aviator Pro Virtual",
            short_name: "AviatorPro",
            start_url: "./",
            display: "standalone",
            background_color: "#0b0e14",
            theme_color: "#ff0055",
            icons: [{ src: iconDataUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // Service Worker Inline para PWA Offline
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }

        /* --- SINTETIZADOR DE ÁUDIO (SEM ARQUIVOS EXTERNOS) --- */
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playFlight() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 8);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 8);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                return osc;
            },
            playWin() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            },
            playCrash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        /* --- BANCO DE DADOS & AUTENTICAÇÃO (LOCALSTORAGE) --- */
        let currentUser = null;
        let authMode = 'login';

        function getUsers() {
            return JSON.parse(localStorage.getItem('aviator_users') || '{}');
        }

        function saveUsers(users) {
            localStorage.setItem('aviator_users', JSON.stringify(users));
        }

        function switchAuthMode(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('auth-btn-text').innerText = mode === 'login' ? 'ENTRAR NO JOGO' : 'CRIAR CONTA (1.000 FICHAS)';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.toLowerCase().trim();
            const password = document.getElementById('auth-password').value;
            const users = getUsers();

            if (authMode === 'register') {
                if (users[email]) {
                    alert('Este e-mail já está cadastrado!');
                    return;
                }
                users[email] = { password: password, balance: 1000.00, history: [] };
                saveUsers(users);
                alert('Conta criada com sucesso! Você ganhou 1.000 fichas virtuais.');
            }

            if (!users[email] || users[email].password !== password) {
                alert('E-mail ou senha incorretos.');
                return;
            }

            currentUser = email;
            localStorage.setItem('aviator_session', email);
            initApp();
        }

        function checkSession() {
            const session = localStorage.getItem('aviator_session');
            const users = getUsers();
            if (session && users[session]) {
                currentUser = session;
                initApp();
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('aviator_session');
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function updateBalanceUI() {
            const users = getUsers();
            const bal = users[currentUser].balance;
            document.getElementById('user-balance').innerText = bal.toFixed(2);
        }

        function modifyBalance(delta) {
            const users = getUsers();
            users[currentUser].balance += delta;
            saveUsers(users);
            updateBalanceUI();
        }

        function addDemoFunds() {
            modifyBalance(500);
            alert('500 fichas virtuais adicionadas à sua conta!');
        }

        /* --- LÓGICA DO JOGO E ALGORITMO RTP (MARGEM DA BANCA 20% -> RTP 80%) --- */
        let gameState = 'WAITING'; // WAITING, RUNNING, CRASHED
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let animationFrame = null;
        let startTime = null;

        let userBet = 0;
        let hasBetInRound = false;
        let hasCashedOut = false;
        let soundOsc = null;

        // MATEMÁTICA DE RTP DA BANCA
        // RTP = 80%. Retorno médio para os jogadores é 80%, a banca retém 20%.
        function generateCrashPoint() {
            const houseEdge = 0.20; // 20% de margem da banca (RTP = 80%)
            const rand = Math.random();

            // 10% de chance de Crash Instantâneo (1.00x)
            if (rand < 0.10) {
                return 1.00;
            }

            // Fórmula Inversa Padrão Ajustada para Margem da Banca Exacta
            // Multiplicador = (1 - HouseEdge) / (1 - Rand)
            let crash = (1.0 - houseEdge) / (1.0 - rand);

            // Cap máximo de multiplicador por rodada para controle de risco
            crash = Math.min(crash, 250.00);

            return Math.floor(crash * 100) / 100;
        }

        function startRound() {
            gameState = 'WAITING';
            currentMultiplier = 1.00;
            hasCashedOut = false;
            
            document.getElementById('multiplier-display').innerText = '1.00x';
            document.getElementById('multiplier-display').style.color = 'white';
            document.getElementById('status-display').innerText = 'PRÓXIMA RODADA EM BREVE...';

            updateActionButton();

            setTimeout(() => {
                // Iniciar Voo
                gameState = 'RUNNING';
                crashPoint = generateCrashPoint();
                startTime = performance.now();
                
                AudioFX.init();
                soundOsc = AudioFX.playFlight();

                document.getElementById('status-display').innerText = '';
                updateActionButton();

                loop();
            }, 3000);
        }

        function loop() {
            if (gameState !== 'RUNNING') return;

            const elapsed = (performance.now() - startTime) / 1000; // segundos
            // Crescimento exponencial do multiplicador
            currentMultiplier = Math.pow(Math.E, 0.06 * elapsed);

            // Auto Cashout Check
            const autoVal = parseFloat(document.getElementById('auto-cashout').value);
            if (hasBetInRound && !hasCashedOut && autoVal && currentMultiplier >= autoVal) {
                triggerCashout();
            }

            if (currentMultiplier >= crashPoint) {
                // AVIAO VOOU (CRASH)
                currentMultiplier = crashPoint;
                triggerCrash();
            } else {
                document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';
                renderCanvas(elapsed);
                animationFrame = requestAnimationFrame(loop);
            }
        }

        function triggerCashout() {
            if (!hasBetInRound || hasCashedOut || gameState !== 'RUNNING') return;

            hasCashedOut = true;
            const winAmount = userBet * currentMultiplier;
            modifyBalance(winAmount);

            AudioFX.playWin();
            updateActionButton();

            document.getElementById('status-display').innerText = `VOCÊ RETIROU ${winAmount.toFixed(2)} FICHAS!`;
            document.getElementById('status-display').style.color = 'var(--green-cashout)';
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            if (soundOsc) try { soundOsc.stop(); } catch(e){}
            AudioFX.playCrash();

            document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';
            document.getElementById('multiplier-display').style.color = 'var(--red-primary)';
            document.getElementById('status-display').innerText = 'O AVIÃO VOOU PARA LONGE!';
            document.getElementById('status-display').style.color = 'var(--red-primary)';

            addHistory(currentMultiplier);

            hasBetInRound = false;
            updateActionButton();

            renderCanvasCrash();

            setTimeout(() => {
                startRound();
            }, 3000);
        }

        /* --- PAINEL DE CONTROLE DA APOSTA --- */
        function adjustBet(val) {
            const input = document.getElementById('bet-amount');
            let current = parseFloat(input.value) || 0;
            input.value = Math.max(1, current + val);
        }

        function multiplyBet(factor) {
            const input = document.getElementById('bet-amount');
            let current = parseFloat(input.value) || 0;
            input.value = Math.max(1, Math.floor(current * factor));
        }

        function handleMainAction() {
            AudioFX.init();
            if (gameState === 'RUNNING' && hasBetInRound && !hasCashedOut) {
                triggerCashout();
                return;
            }

            if (gameState === 'WAITING' && !hasBetInRound) {
                const amount = parseFloat(document.getElementById('bet-amount').value);
                const users = getUsers();
                const balance = users[currentUser].balance;

                if (isNaN(amount) || amount <= 0) {
                    alert('Insira um valor de aposta válido.');
                    return;
                }
                if (amount > balance) {
                    alert('Saldo de fichas insuficiente!');
                    return;
                }

                // Deduz Aposta
                userBet = amount;
                modifyBalance(-userBet);
                hasBetInRound = true;
                updateActionButton();
            }
        }

        function updateActionButton() {
            const btn = document.getElementById('btn-action');

            if (gameState === 'RUNNING' && hasBetInRound && !hasCashedOut) {
                btn.className = 'btn-main-action btn-cashout';
                const currentWin = (userBet * currentMultiplier).toFixed(2);
                btn.innerText = `RETIRAR (${currentWin})`;
                return;
            }

            if (hasBetInRound && !hasCashedOut) {
                btn.className = 'btn-main-action btn-waiting';
                btn.innerText = 'AGUARDANDO RODADA...';
                return;
            }

            if (hasCashedOut) {
                btn.className = 'btn-main-action btn-waiting';
                btn.innerText = 'APOSTA GANHA!';
                return;
            }

            if (gameState === 'WAITING') {
                btn.className = 'btn-main-action btn-bet';
                btn.innerText = 'APOSTAR';
            } else {
                btn.className = 'btn-main-action btn-waiting';
                btn.innerText = 'RODADA EM ANDAMENTO';
            }
        }

        /* --- PAINEL DE HISTÓRICO --- */
        function addHistory(val) {
            const bar = document.getElementById('history-bar');
            const item = document.createElement('div');
            
            let colorClass = 'h-blue';
            if (val >= 2.0) colorClass = 'h-purple';
            if (val >= 10.0) colorClass = 'h-gold';

            item.className = `history-item ${colorClass}`;
            item.innerText = val.toFixed(2) + 'x';

            bar.insertBefore(item, bar.firstChild);

            if (bar.children.length > 20) {
                bar.removeChild(bar.lastChild);
            }
        }

        /* --- RENDERIZAÇÃO GRÁFICA (CANVAS ENGINES) --- */
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function renderCanvas(elapsed) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Grade Dinâmica de Fundo
            ctx.strokeStyle = '#192231';
            ctx.lineWidth = 1;
            const gridOffset = (elapsed * 50) % 40;

            for (let x = 0; x < w; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let y = 0; y < h; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y + gridOffset);
                ctx.lineTo(w, y + gridOffset);
                ctx.stroke();
            }

            // Curva do Voo
            const progress = Math.min(1, elapsed / 10);
            const startX = 40;
            const startY = h - 40;
            const endX = startX + (w - 120) * Math.min(1, elapsed / 6);
            const endY = startY - (h - 120) * Math.min(1, (currentMultiplier - 1) / 3);

            const controlX = startX;
            const controlY = endY;

            // Preenchimento gradiente abaixo da linha
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, 'rgba(255, 0, 85, 0.3)');
            grad.addColorStop(1, 'rgba(255, 0, 85, 0.0)');

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(controlX, controlY, endX, endY);
            ctx.lineTo(endX, startY);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Linha Trajetória
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(controlX, controlY, endX, endY);
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Desenhar Avião
            drawAirplane(endX, endY);
        }

        function drawAirplane(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-Math.PI / 12); // Inclinação de subida

            // Brilho do Avião
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 15;

            // Corpo do Avião Jato (Vetor)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-15, -12);
            ctx.lineTo(-8, 0);
            ctx.lineTo(-15, 12);
            ctx.closePath();
            ctx.fill();

            // Asas Vermelhas
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-10, -18);
            ctx.lineTo(-4, 0);
            ctx.lineTo(-10, 18);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function renderCanvasCrash() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);
        }

        /* --- INICIALIZAÇÃO DA APLICAÇÃO --- */
        function initApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            
            resizeCanvas();
            updateBalanceUI();
            startRound();
        }

        // Executar checagem de sessão ao carregar
        window.onload = () => {
            checkSession();
        };
    </script>
</body>
</html>

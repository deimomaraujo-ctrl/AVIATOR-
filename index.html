<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo e Loja</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 {
            color: var(--accent-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .admin-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        .item-list {
            margin-top: 20px;
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .item-info {
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PAINEL DO ADMINISTRADOR</h1>

    <!-- GERENCIAR BANNER / SLIDE -->
    <div class="admin-panel">
        <h3>✨ Gerenciar Banner (Slideshow)</h3>
        <div class="form-group">
            <label>SELECIONAR IMAGEM DO BANNER DA GALERIA</label>
            <div class="file-input-wrapper">
                <input type="file" id="bannerFile" accept="image/*" onchange="converterImagemBanner(event)">
            </div>
            <input type="hidden" id="bannerUrl">
        </div>
        <div class="form-group">
            <label>OU DIGITE A URL DA IMAGEM</label>
            <input type="text" id="bannerUrlText" placeholder="https://exemplo.com/banner.jpg">
        </div>
        <button onclick="adicionarBanner()">ADICIONAR IMAGEM AO BANNER</button>

        <div class="item-list" id="listaBannerAdmin">
            <!-- Banners cadastrados aparecem aqui -->
        </div>
    </div>

    <!-- GERENCIAR PRODUTOS -->
    <div class="admin-panel">
        <h3>✨ Gerenciar Produtos</h3>
        <div class="form-group">
            <label>NOME DO PRODUTO</label>
            <input type="text" id="prodNome" placeholder="Ex: Selagem Térmica Liss 1L">
        </div>
        <div class="form-group">
            <label>CATEGORIA</label>
            <select id="prodCategoria">
                <option value="Selagem Progressiva">Selagem Progressiva</option>
                <option value="Finalizador">Finalizador</option>
                <option value="Coloração">Coloração</option>
                <option value="Hidratação">Hidratação</option>
            </select>
        </div>
        <div class="form-group">
            <label>ESPECIFICAÇÕES (VOLUME / PESO)</label>
            <input type="text" id="prodSpec" placeholder="Ex: Frasco 1 Litro">
        </div>
        <div class="form-group">
            <label>PREÇO (R$)</label>
            <input type="number" step="0.01" id="prodPreco" placeholder="149.90">
        </div>
        <div class="form-group">
            <label>FOTO DO PRODUTO (GALERIA OU URL)</label>
            <div class="file-input-wrapper mb-2" style="margin-bottom: 8px;">
                <input type="file" id="prodFile" accept="image/*" onchange="converterImagemProduto(event)">
            </div>
            <input type="text" id="prodUrl" placeholder="https://exemplo.com/foto.jpg">
        </div>
        <button onclick="adicionarProduto()">SALVAR E PUBLICAR PRODUTO</button>

        <div class="item-list" id="listaProdutosAdmin">
            <!-- Produtos cadastrados aparecem aqui -->
        </div>
    </div>
</div>

<script>
    // Carregar dados salvos ou criar listas vazias
    let produtos = JSON.parse(localStorage.getItem('admin_produtos')) || [
        { nome: "Kit Cronograma Capilar Completo Salão", categoria: "Hidratação", preco: 198.00 },
        { nome: "Óleo Reparador de Pontas Finalizador 60ml", categoria: "Finalizador", preco: 54.90 },
        { nome: "Tintura Permanente Profissional Tonalizante 60g", categoria: "Coloração", preco: 32.50 },
        { nome: "Gloss Redutor de Volume Selagem Orgânica 1L", categoria: "Selagem Progressiva", preco: 179.00 }
    ];

    let banners = JSON.parse(localStorage.getItem('admin_banners')) || [];

    // Converter imagem do Banner da Galeria para Base64
    function converterImagemBanner(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('bannerUrlText').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // Converter imagem do Produto da Galeria para Base64
    function converterImagemProduto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prodUrl').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // Funções de Banners
    function adicionarBanner() {
        const url = document.getElementById('bannerUrlText').value;
        if (!url) {
            alert('Por favor, selecione uma imagem da galeria ou informe uma URL.');
            return;
        }
        banners.push(url);
        localStorage.setItem('admin_banners', JSON.stringify(banners));
        document.getElementById('bannerUrlText').value = '';
        document.getElementById('bannerFile').value = '';
        atualizarPainel();
    }

    function excluirBanner(index) {
        banners.splice(index, 1);
        localStorage.setItem('admin_banners', JSON.stringify(banners));
        atualizarPainel();
    }

    // Funções de Produtos
    function adicionarProduto() {
        const nome = document.getElementById('prodNome').value;
        const categoria = document.getElementById('prodCategoria').value;
        const spec = document.getElementById('prodSpec').value;
        const preco = parseFloat(document.getElementById('prodPreco').value);
        const url = document.getElementById('prodUrl').value;

        if (!nome || isNaN(preco)) {
            alert('Preencha pelo menos o nome e o preço do produto.');
            return;
        }

        produtos.push({ nome, categoria, spec, preco, url });
        localStorage.setItem('admin_produtos', JSON.stringify(produtos));

        // Limpar campos
        document.getElementById('prodNome').value = '';
        document.getElementById('prodSpec').value = '';
        document.getElementById('prodPreco').value = '';
        document.getElementById('prodUrl').value = '';
        document.getElementById('prodFile').value = '';

        atualizarPainel();
    }

    function excluirProduto(index) {
        produtos.splice(index, 1);
        localStorage.setItem('admin_produtos', JSON.stringify(produtos));
        atualizarPainel();
    }

    // Atualizar visualização na tela do Admin
    function atualizarPainel() {
        // Renderizar Banners
        const listaBannersEl = document.getElementById('listaBannerAdmin');
        listaBannersEl.innerHTML = '';
        banners.forEach((b, index) => {
            listaBannersEl.innerHTML += `
                <div class="item-card">
                    <span class="item-info">Banner ${index + 1}</span>
                    <button class="btn-danger" onclick="excluirBanner(${index})">Excluir</button>
                </div>
            `;
        });

        // Renderizar Produtos
        const listaProdEl = document.getElementById('listaProdutosAdmin');
        listaProdEl.innerHTML = '';
        produtos.forEach((p, index) => {
            listaProdEl.innerHTML += `
                <div class="item-card">
                    <span class="item-info"><strong>${p.nome}</strong> (${p.categoria}) - R$ ${p.preco.toFixed(2)}</span>
                    <button class="btn-danger" onclick="excluirProduto(${index})">Excluir</button>
                </div>
            `;
        });
    }

    // Executar ao carregar a página
    atualizarPainel();
</script>

</body>
</html>

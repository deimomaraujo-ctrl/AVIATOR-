<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1015">
<title>Aviator Pro</title>
<style>
:root {
    --bg-main: #07090e;
    --bg-card: #121722;
    --bg-input: #1a2130;
    --green-primary: #00c853;
    --green-hover: #00a844;
    --red-primary: #e6004c;
    --text-white: #ffffff;
    --text-muted: #8c9cb6;
    --border-color: #232c3d;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); user-select: none; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; padding-bottom: 65px; }

/* --- AUTENTICAÇÃO --- */
#auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #0f2619 0%, #07090e 100%); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 420px; padding: 30px 24px; box-shadow: 0 25px 60px rgba(0, 200, 83, 0.15); text-align: center; }
.auth-logo { width: 75px; height: 75px; margin: 0 auto 15px; background: linear-gradient(135deg, #00c853, #004d1f); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0, 200, 83, 0.3); }
.auth-title { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #fff; margin-bottom: 4px; }
.auth-subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 20px; }
.auth-tabs { display: flex; background: var(--bg-input); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 13px; }
.auth-tab.active { background: var(--green-primary); color: #00260b; box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3); }
.input-group { margin-bottom: 14px; text-align: left; }
.input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
.input-group input { width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 14px; outline: none; transition: 0.3s; }
.input-group input:focus { border-color: var(--green-primary); box-shadow: 0 0 10px rgba(0, 200, 83, 0.2); }
.phone-row { display: flex; gap: 8px; }
.phone-prefix { width: 75px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); margin-bottom: 16px; text-align: left; }
.checkbox-group input { accent-brColor: var(--green-primary); width: 16px; height: 16px; }
.checkbox-group a { color: var(--green-primary); text-decoration: none; font-weight: 700; }
.btn-submit { width: 100%; padding: 14px; background: linear-gradient(90deg, #00c853, #00e676); border: none; border-radius: 10px; color: #00260b; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 200, 83, 0.3); transition: 0.2s; letter-spacing: 0.5px; }

/* --- INTERFACE PRINCIPAL --- */
#app-screen { display: none; flex-direction: column; min-height: calc(100vh - 65px); }
header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; color: var(--red-primary); letter-spacing: 1px; }
.user-info-bar { display: flex; align-items: center; gap: 8px; }
.balance-badge { background: #0c1017; border: 1px solid var(--border-color); padding: 3px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 12px; color: var(--green-primary); }
.btn-deposit-top { background: var(--green-primary); color: #00260b; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
.btn-menu-top { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 0 4px; }

/* HISTÓRICO MULTIPLICADORES */
.history-bar { background: #0b0f17; padding: 6px 14px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border-color); scrollbar-width: none; }
.history-bar::-webkit-scrollbar { display: none; }
.history-item { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.h-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
.h-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
.h-gold { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }

/* LAYOUT PRINCIPAL DO JOGO */
.game-layout { display: flex; flex-direction: column; flex: 1; max-width: 900px; margin: 0 auto; width: 100%; }

/* CANVAS DE VOO */
.game-display-wrapper { display: flex; flex-direction: column; flex: 1; }
.game-display { position: relative; height: 260px; background: radial-gradient(circle at 20% 80%, #1a0610 0%, #07090e 70%); margin: 8px; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
@media (min-width: 850px) { .game-display { height: 340px; margin: 8px 0; } }
canvas { width: 100%; height: 100%; display: block; }
.multiplier-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.multiplier-text { font-size: 48px; font-weight: 900; color: white; text-shadow: 0 0 20px rgba(230, 0, 76, 0.6); line-height: 1; letter-spacing: -1px; }
.status-text { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }

/* PAINEL DE CONTROLE DE APOSTAS DUPLO */
.controls-container { padding: 0 8px 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.bet-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.bet-mode-tabs { display: flex; background: var(--bg-input); border-radius: 8px; padding: 2px; width: fit-content; margin-bottom: 2px; }
.bet-mode-tab { padding: 4px 12px; border: none; background: transparent; color: var(--text-muted); font-size: 10px; font-weight: 800; border-radius: 6px; cursor: pointer; }
.bet-mode-tab.active { background: #28334a; color: white; }

.bet-inputs-row { display: flex; gap: 8px; align-items: center; }
.input-stepper { display: flex; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px 8px; flex: 1.2; }
.step-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; font-weight: bold; cursor: pointer; padding: 0 4px; }
.step-input-box { flex: 1; text-align: center; }
.step-input-box input { width: 100%; background: transparent; border: none; color: white; font-size: 15px; font-weight: 900; text-align: center; outline: none; }

.quick-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex: 1.5; }
.btn-chip { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 2px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; text-align: center; }
.btn-chip:hover { background: #232c3d; color: white; }

.btn-main-action { width: 100%; height: 46px; border: none; border-radius: 8px; font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; letter-spacing: 0.5px; }
.btn-bet { background: linear-gradient(180deg, #00c853, #008f3b); color: #00260b; box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3); }
.btn-cashout { background: linear-gradient(180deg, #ff9800, #f57c00); color: #fff; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); }
.btn-waiting { background: #1f293d; color: var(--text-muted); cursor: not-allowed; }

/* RODAPÉ INFERIOR FIXO */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0c1017; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; gap: 3px; flex: 1; }
.nav-item.active { color: var(--green-primary); }
.nav-item svg { width: 20px; height: 20px; fill: currentColor; }

/* PAINEL LATERAL / MODAL DO MENU INFERIOR */
.drawer-overlay { position: fixed; inset: 0; background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(4px); z-index: 3000; display: none; align-items: flex-end; justify-content: center; }
.drawer-card { background: var(--bg-card); border: 1px solid var(--border-color); border-top-left-radius: 20px; border-top-right-radius: 20px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 20px 16px 30px 16px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.drawer-user-header { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border-color); }
.drawer-user-info { display: flex; align-items: center; gap: 10px; }
.drawer-avatar { width: 40px; height: 40px; background: #28334a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid var(--border-color); }
.drawer-username { font-weight: 800; font-size: 14px; color: white; }
.btn-change-avatar { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: 700; }

.menu-list { display: flex; flex-direction: column; gap: 4px; }
.menu-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.03); color: white; font-size: 13px; font-weight: 700; cursor: pointer; text-align: left; width: 100%; }
.menu-item:hover { background: rgba(255,255,255,0.02); }
.menu-item-left { display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
.menu-badge { background: var(--green-primary); color: #00260b; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 10px; }

/* MODAIS PADRÃO (DEPÓSITO, HISTÓRICO, ETC) */
.modal-overlay { position: fixed; inset: 0; background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(5px); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 900; }
.modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; font-weight: bold; cursor: pointer; }

/* VALORES DE DEPÓSITO DO PRINT */
.deposit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.dep-chip { background: var(--bg-input); border: 1px solid var(--border-color); padding: 12px 8px; border-radius: 8px; text-align: center; color: white; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; position: relative; }
.dep-chip.selected { border-color: var(--green-primary); background: rgba(0, 200, 83, 0.1); color: var(--green-primary); }
.dep-hot { position: absolute; top: -6px; right: 4px; background: #ff9800; color: #000; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; }
.btn-modal-confirm { width: 100%; padding: 14px; background: var(--green-primary); border: none; border-radius: 10px; color: #00260b; font-size: 14px; font-weight: 900; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,200,83,0.3); }

/* HISTÓRICO TABLE */
.history-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.history-table th { color: var(--text-muted); text-align: left; padding: 6px; border-bottom: 1px solid var(--border-color); font-size: 10px; text-transform: uppercase; }
.history-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.03); font-weight: 700; }
</style>
</head>
<body>

<!-- TELA DE AUTENTICAÇÃO -->
<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="#00260b">
                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
        </div>
        <h1 class="auth-title">Aviator Pro</h1>
        <p class="auth-subtitle">Cassino & Crash Game Oficial</p>
        
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Entrar</button>
            <button class="auth-tab" id="tab-register" onclick="switchAuthMode('register')">Cadastrar</button>
        </div>
        
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group" id="cpf-group" style="display:none;">
                <label>CPF</label>
                <input type="text" id="auth-cpf" placeholder="000.000.000-00">
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="auth-email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group" id="phone-group" style="display:none;">
                <label>Telefone</label>
                <div class="phone-row">
                    <div class="phone-prefix">🇧🇷 +55</div>
                    <input type="text" id="auth-phone" placeholder="(99) 99999-9999">
                </div>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>
            <div class="checkbox-group" id="terms-group" style="display:none;">
                <input type="checkbox" id="auth-terms">
                <label for="auth-terms" style="display:inline; text-transform:none; font-size:11px;">Confirmo que sou maior de 18 anos e aceito os <a href="#" onclick="alert('Termos e Condições do Aviator Pro')">Termos e Condições</a>.</label>
            </div>
            <button type="submit" class="btn-submit" id="auth-btn-text">ENTRAR</button>
        </form>
    </div>
</div>

<!-- TELA PRINCIPAL DO JOGO -->
<div id="app-screen">
    <header>
        <div class="brand">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
            Aviator
        </div>
        <div class="user-info-bar">
            <div class="balance-badge">
                <span>🪙</span>
                <span id="user-balance">0.00</span> BRL
            </div>
            <button class="btn-deposit-top" onclick="openModal('deposit-modal')">DEPOSITAR</button>
            <button class="btn-menu-top" onclick="openDrawer('menu-drawer')">☰</button>
        </div>
    </header>

    <!-- HISTÓRICO DE RODADAS -->
    <div class="history-bar" id="history-bar"></div>

    <div class="game-layout">
        <!-- ÁREA CENTRAL DO JOGO -->
        <div class="game-display-wrapper">
            <div class="game-display">
                <canvas id="game-canvas"></canvas>
                <div class="multiplier-overlay">
                    <div class="multiplier-text" id="multiplier-display">1.00x</div>
                    <div class="status-text" id="status-display">AGUARDANDO PRÓXIMA RODADA</div>
                </div>
            </div>

            <!-- PAINEL DE CONTROLE DUPLO DE APOSTAS -->
            <div class="controls-container">
                <!-- APOSTA 1 -->
                <div class="bet-card">
                    <div class="bet-mode-tabs">
                        <button class="bet-mode-tab active">Aposta</button>
                        <button class="bet-mode-tab">Automático</button>
                    </div>
                    <div class="bet-inputs-row">
                        <div class="input-stepper">
                            <button class="step-btn" onclick="adjustBet('bet1-amount', -1)">-</button>
                            <div class="step-input-box">
                                <input type="number" id="bet1-amount" value="1.00" step="1" min="1">
                            </div>
                            <button class="step-btn" onclick="adjustBet('bet1-amount', 1)">+</button>
                        </div>
                        <div class="quick-chips">
                            <button class="btn-chip" onclick="setBet('bet1-amount', 5)">5</button>
                            <button class="btn-chip" onclick="setBet('bet1-amount', 10)">10</button>
                            <button class="btn-chip" onclick="setBet('bet1-amount', 25)">25</button>
                            <button class="btn-chip" onclick="setBet('bet1-amount', 50)">50</button>
                        </div>
                    </div>
                    <button id="btn-action-1" class="btn-main-action btn-bet" onclick="handleMainAction(1)">APOSTA 1.00 BRL</button>
                </div>

                <!-- APOSTA 2 -->
                <div class="bet-card">
                    <div class="bet-mode-tabs">
                        <button class="bet-mode-tab active">Aposta</button>
                        <button class="bet-mode-tab">Automático</button>
                    </div>
                    <div class="bet-inputs-row">
                        <div class="input-stepper">
                            <button class="step-btn" onclick="adjustBet('bet2-amount', -1)">-</button>
                            <div class="step-input-box">
                                <input type="number" id="bet2-amount" value="1.00" step="1" min="1">
                            </div>
                            <button class="step-btn" onclick="adjustBet('bet2-amount', 1)">+</button>
                        </div>
                        <div class="quick-chips">
                            <button class="btn-chip" onclick="setBet('bet2-amount', 5)">5</button>
                            <button class="btn-chip" onclick="setBet('bet2-amount', 10)">10</button>
                            <button class="btn-chip" onclick="setBet('bet2-amount', 25)">25</button>
                            <button class="btn-chip" onclick="setBet('bet2-amount', 50)">50</button>
                        </div>
                    </div>
                    <button id="btn-action-2" class="btn-main-action btn-bet" onclick="handleMainAction(2)">APOSTA 1.00 BRL</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- RODAPÉ INFERIOR (CONFORME SOLICITADO, EXCLUSIVO PARA O APLICATIVO DO AVIATOR) -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNavTab(this, 'home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Início
    </button>
    <button class="nav-item" onclick="openModal('history-modal')">
        <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        Anterior
    </button>
    <button class="nav-item" onclick="scrollToTopGame()">
        <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        Topo
    </button>
</nav>

<!-- DRAWER DO MENU INFERIOR (CONFIGURAÇÕES DO PRINT 1001434294.jpg) -->
<div class="drawer-overlay" id="menu-drawer">
    <div class="drawer-card">
        <div class="drawer-user-header">
            <div class="drawer-user-info">
                <div class="drawer-avatar">🥷</div>
                <div>
                    <div class="drawer-username" id="drawer-username">Jogador</div>
                    <div style="font-size:11px; color:var(--text-muted);" id="drawer-usermail">user@email.com</div>
                </div>
            </div>
            <button class="btn-change-avatar" onclick="alert('Avatar alterado com sucesso!')">Mudar Avatar</button>
        </div>

        <div class="menu-list">
            <div class="menu-item">
                <div class="menu-item-left"><span>🔊</span> Som</div>
                <label style="position:relative; display:inline-block; width:40px; height:22px;">
                    <input type="checkbox" id="setting-sound" checked onchange="gameSettings.soundEnabled=this.checked" style="opacity:0; width:0; height:0;">
                    <span style="position:absolute; cursor:pointer; inset:0; background:#232c3d; transition:.3s; border-radius:22px;"></span>
                </label>
            </div>
            <div class="menu-item">
                <div class="menu-item-left"><span>🎵</span> Música</div>
                <label style="position:relative; display:inline-block; width:40px; height:22px;">
                    <input type="checkbox" id="setting-music" onchange="gameSettings.musicEnabled=this.checked" style="opacity:0; width:0; height:0;">
                    <span style="position:absolute; cursor:pointer; inset:0; background:#232c3d; transition:.3s; border-radius:22px;"></span>
                </label>
            </div>
            <div class="menu-item">
                <div class="menu-item-left"><span>✈️</span> Animação</div>
                <label style="position:relative; display:inline-block; width:40px; height:22px;">
                    <input type="checkbox" id="setting-plane" checked onchange="gameSettings.planeAnimation=this.checked" style="opacity:0; width:0; height:0;">
                    <span style="position:absolute; cursor:pointer; inset:0; background:#232c3d; transition:.3s; border-radius:22px;"></span>
                </label>
            </div>

            <button class="menu-item" onclick="openModal('history-modal'); closeDrawer('menu-drawer');">
                <div class="menu-item-left"><span>🕒</span> Meu Histórico De Apostas</div>
                <span>›</span>
            </button>
            <button class="menu-item" onclick="alert('Limites de jogo configurados para Jogo Responsável.')">
                <div class="menu-item-left"><span>⚙️</span> Limites De Jogo</div>

            </button>
            <button class="menu-item" onclick="alert('Como Jogar: O objetivo é retirar sua aposta antes que o avião voe para longe!')">
                <div class="menu-item-left"><span>❓</span> Como Jogar</div>
                <span>›</span>
            </button>
            <button class="menu-item" onclick="alert('Regras do Jogo: O multiplicador começa em 1.00x e pode subir indefinidamente.')">
                <div class="menu-item-left"><span>📄</span> Regras De Jogo</div>
                <span>›</span>
            </button>
            <button class="menu-item" onclick="alert('Provably Fair: Todas as rodadas são geradas de forma totalmente aleatória e verificável.')">
                <div class="menu-item-left"><span>🛡️</span> Configurações Comprovadamente Justas</div>
                <span>›</span>
            </button>
            <button class="menu-item" onclick="logout()" style="color:var(--red-primary); margin-top:10px;">
                <div class="menu-item-left" style="color:var(--red-primary);"><span>🚪</span> Sair</div>

</div>

<!-- MODAL DE DEPÓSITO (ESTILO PRINT 1001434198.jpg) -->
<div class="modal-overlay" id="deposit-modal">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title">Depositar</div>
            <button class="modal-close" onclick="closeModal('deposit-modal')">&times;</button>
        </div>
        <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">Método de Pagamento: <b>PIX</b></div>
        
        <div class="deposit-grid">
            <div class="dep-chip selected" onclick="selectDepositValue(50, this)">R$ 50</div>
            <div class="dep-chip" onclick="selectDepositValue(100, this)">R$ 100</div>
            <div class="dep-chip" onclick="selectDepositValue(250, this)">R$ 250</div>
            <div class="dep-chip" onclick="selectDepositValue(500, this, true)">R$ 500<span class="dep-hot">HOT</span></div>
            <div class="dep-chip" onclick="selectDepositValue(1000, this, true)">R$ 1000<span class="dep-hot">HOT</span></div>
            <div class="dep-chip" onclick="selectDepositValue(2000, this, true)">R$ 2000<span class="dep-hot">HOT</span></div>
        </div>

        <div class="input-group" style="margin-top:10px;">
            <label>Outro Valor (BRL)</label>

<!-- MODAL DE HISTÓRICO DE RODADAS -->
<div class="modal-overlay" id="history-modal">
    <div class="modal-card" style="max-width:450px;">
        <div class="modal-header">
            <div class="modal-title">Histórico de Rodadas</div>
            <button class="modal-close" onclick="closeModal('history-modal')">&times;</button>
        </div>
        <div style="max-height:280px; overflow-y:auto;">
            <table class="history-table">
                <thead>
                    <tr><th>Rodada / Multiplicador</th><th>Status</th><th>Horário</th></tr>
                </thead>
                <tbody id="history-modal-list">
                </tbody>
            </table>
        </div>
        <button class="btn-modal-confirm" style="background:var(--bg-input); color:white; margin-top:12px;" onclick="closeModal('history-modal')">Fechar</button>
    </div>
</div>

<script>
/* --- ESTADO E GERENCIAMENTO DE USUÁRIOS --- */
let currentUserEmail = null;
let currentUserName = 'Jogador';
let authMode = 'login';
let gameSettings = { soundEnabled: true, musicEnabled: false, planeAnimation: true };
let selectedDepositAmount = 50;

function getUsers() { return JSON.parse(localStorage.getItem('aviator_pro_users_v1') || '{}'); }
function saveUsers(users) { localStorage.setItem('aviator_pro_users_v1', JSON.stringify(users)); }

function switchAuthMode(mode) {
    authMode = mode;
    document.getElementById('tab-login').classList.toggle('active', mode === 'login');
    document.getElementById('tab-register').classList.toggle('active', mode === 'register');
    document.getElementById('cpf-group').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('phone-group').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('terms-group').style.display = mode === 'register' ? 'flex' : 'none';
    document.getElementById('auth-btn-text').innerText = mode === 'login' ? 'ENTRAR' : 'Criar conta';
}

function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.toLowerCase().trim();
    const password = document.getElementById('auth-password').value;
    const users = getUsers();
    
    if (authMode === 'register') {
        const cpf = document.getElementById('auth-cpf').value.trim();
        const phone = document.getElementById('auth-phone').value.trim();
        const terms = document.getElementById('auth-terms').checked;
        if (!cpf || !phone) { alert('Preencha o CPF e o telefone.'); return; }
        if (!terms) { alert('Você precisa aceitar os Termos e Condições.'); return; }
        if (users[email]) { alert('Este e-mail já está cadastrado!'); return; }
        
        users[email] = { name: email.split('@')[0], password: password, balance: 1000.00 };
        saveUsers(users);
        alert('Conta criada com sucesso! Bônus de 1.000 fichas adicionado.');
    }
    
    if (!users[email] || users[email].password !== password) {
        alert('E-mail ou senha incorretos.');
        return;
    }
    
    currentUserEmail = email;
    currentUserName = users[email].name;
    localStorage.setItem('aviator_pro_session_v1', email);
    initApp();
}

function checkSession() {
    const session = localStorage.getItem('aviator_pro_session_v1');
    const users = getUsers();
    if (session && users[session]) {
        currentUserEmail = session;
        currentUserName = users[session].name;
        initApp();
    }
}

function logout() {
    currentUserEmail = null;
    localStorage.removeItem('aviator_pro_session_v1');
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
    closeDrawer('menu-drawer');
}

function updateBalanceUI() {
    const users = getUsers();
    if(users[currentUserEmail]) {
        document.getElementById('user-balance').innerText = users[currentUserEmail].balance.toFixed(2);
        document.getElementById('drawer-username').innerText = currentUserName;
        document.getElementById('drawer-usermail').innerText = currentUserEmail;
    }
}

function modifyBalance(delta) {
    const users = getUsers();
    if(users[currentUserEmail]) {
        users[currentUserEmail].balance += delta;
        saveUsers(users);
        updateBalanceUI();
    }
}

/* --- MODAIS E DRAWER --- */
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function openDrawer(id) { document.getElementById(id).style.display = 'flex'; }
function closeDrawer(id) { document.getElementById(id).style.display = 'none'; }
function scrollToTopGame() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
function switchNavTab(el, tab) {
    document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
}

function selectDepositValue(val, el, isHot=false) {
    document.querySelectorAll('.dep-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedDepositAmount = val;
    document.getElementById('custom-deposit-val').value = val;
}

function confirmDeposit() {
    const val = parseFloat(document.getElementById('custom-deposit-val').value) || selectedDepositAmount;
    if (val <= 0) { alert('Insira um valor válido.'); return; }
    modifyBalance(val);
    alert(`Depósito PIX de R$ ${val.toFixed(2)} simulado com sucesso!`);
    closeModal('deposit-modal');
}

/* --- MOTOR DO JOGO AVIATOR --- */
let gameState = 'WAITING';
let currentMultiplier = 1.00;
let crashPoint = 1.00;
let startTime = null;

// Duas apostas independentes
let bets = {
    1: { amount: 1.00, active: false, cashedOut: false },
    2: { amount: 1.00, active: false, cashedOut: false }
};

function adjustBet(inputId, delta) {
    const input = document.getElementById(inputId);
    let val = parseFloat(input.value) || 1.00;
    val = Math.max(1, val + delta);
    input.value = val.toFixed(2);
    updateActionButtons();
}

function setBet(inputId, val) {
    document.getElementById(inputId).value = val.toFixed(2);
    updateActionButtons();
}

function generateCrashPoint() {
    const rand = Math.random();
    if (rand < 0.06) return 1.00;
    let crash = 0.95 / (1.0 - rand);
    return Math.min(Math.floor(crash * 100) / 100, 300.00);
}

function startRound() {
    gameState = 'WAITING';
    currentMultiplier = 1.00;
    for (let id in bets) {
        if (bets[id].active && !bets[id].cashedOut) {
            // Mantém ativa se apostou antes
        } else {
            bets[id].active = false;
            bets[id].cashedOut = false;
        }
    }
    
    document.getElementById('multiplier-display').innerText = '1.00x';
    document.getElementById('multiplier-display').style.color = 'white';
    document.getElementById('status-display').innerText = 'PRÓXIMA RODADA EM BREVE...';
    updateActionButtons();
    
    setTimeout(() => {
        gameState = 'RUNNING';
        crashPoint = generateCrashPoint();
        startTime = performance.now();
        document.getElementById('status-display').innerText = '';
        updateActionButtons();
        loop();
    }, 3000);
}

function loop() {
    if (gameState !== 'RUNNING') return;
    const elapsed = (performance.now() - startTime) / 1000;
    currentMultiplier = Math.pow(Math.E, 0.07 * elapsed);
    
    if (currentMultiplier >= crashPoint) {
        currentMultiplier = crashPoint;
        triggerCrash();
    } else {
        document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';
        updateActionButtons();
        renderCanvas(elapsed);
        requestAnimationFrame(loop);
    }
}

function triggerCashout(id) {
    if (!bets[id].active || bets[id].cashedOut || gameState !== 'RUNNING') return;
    bets[id].cashedOut = true;
    const winAmount = bets[id].amount * currentMultiplier;
    modifyBalance(winAmount);
    updateActionButtons();
}

function triggerCrash() {
    gameState = 'CRASHED';
    document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';
    document.getElementById('multiplier-display').style.color = 'var(--red-primary)';
    document.getElementById('status-display').innerText = 'FUGIU!';
    document.getElementById('status-display').style.color = 'var(--red-primary)';
    
    for (let id in bets) {
        bets[id].active = false;
        bets[id].cashedOut = false;
    }
    
    addHistory(currentMultiplier);
    updateActionButtons();
    renderCanvasCrash();
    
    setTimeout(() => { startRound(); }, 3500);
}

function handleMainAction(id) {
    const amountInput = parseFloat(document.getElementById(`bet${id}-amount`).value);
    const users = getUsers();
    
    if (gameState === 'RUNNING' && bets[id].active && !bets[id].cashedOut) {
        triggerCashout(id);
        return;
    }
    
    if (gameState === 'WAITING' || !bets[id].active) {
        if (isNaN(amountInput) || amountInput <= 0) { alert('Insira um valor válido.'); return; }
        if (amountInput > users[currentUserEmail].balance) { alert('Saldo insuficiente!'); return; }
        
        bets[id].amount = amountInput;
        modifyBalance(-amountInput);
        bets[id].active = true;
        bets[id].cashedOut = false;
        updateActionButtons();
    }
}

function updateActionButtons() {
    for (let id of [1, 2]) {
        const btn = document.getElementById(`btn-action-${id}`);
        const currentAmt = parseFloat(document.getElementById(`bet${id}-amount`).value) || 1.00;
        
        if (gameState === 'RUNNING' && bets[id].active && !bets[id].cashedOut) {
            btn.className = 'btn-main-action btn-cashout';
            btn.innerText = `RETIRAR (${(bets[id].amount * currentMultiplier).toFixed(2)})`;
        } else if (bets[id].active && !bets[id].cashedOut) {
            btn.className = 'btn-main-action btn-waiting';
            btn.innerText = `AGUARDANDO (${currentAmt.toFixed(2)} BRL)`;
        } else if (bets[id].cashedOut) {
            btn.className = 'btn-main-action btn-waiting';
            btn.innerText = 'SAQUE REALIZADO';
        } else {
            btn.className = 'btn-main-action btn-bet';
            btn.innerText = `APOSTA ${currentAmt.toFixed(2)} BRL`;
        }
    }
}

function addHistory(val) {
    const bar = document.getElementById('history-bar');
    const modalList = document.getElementById('history-modal-list');
    
    let colorClass = 'h-blue';
    if (val >= 2.0) colorClass = 'h-purple';
    if (val >= 10.0) colorClass = 'h-gold';
    
    // Barra superior
    const item = document.createElement('div');
    item.className = `history-item ${colorClass}`;
    item.innerText = val.toFixed(2) + 'x';
    bar.insertBefore(item, bar.firstChild);
    if (bar.children.length > 20) bar.removeChild(bar.lastChild);
    
    // Tabela Modal
    const row = document.createElement('tr');
    row.innerHTML = `<td><span class="history-item ${colorClass}" style="display:inline-block;">${val.toFixed(2)}x</span></td><td>Encerrada</td><td>${new Date().toLocaleTimeString()}</td>`;
    modalList.insertBefore(row, modalList.firstChild);
}

/* --- RENDERIZAÇÃO CANVAS --- */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

function renderCanvas(elapsed) {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    
    ctx.strokeStyle = '#151d2c';
    ctx.lineWidth = 1;
    const gridOffset = (elapsed * 35) % 35;
    for (let x = 0; x < w; x += 35) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 35) { ctx.beginPath(); ctx.moveTo(0, y + gridOffset); ctx.lineTo(w, y + gridOffset); ctx.stroke(); }
    
    const startX = 25;
    const startY = h - 25;
    const endX = startX + (w - 80) * Math.min(1, elapsed / 5);
    const endY = startY - (h - 80) * Math.min(1, (currentMultiplier - 1) / 4);
    
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(0, 200, 83, 0.3)');
    grad.addColorStop(1, 'rgba(0, 200, 83, 0.0)');
    
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX, endY, endX, endY);
    ctx.lineTo(endX, startY);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX, endY, endX, endY);
    ctx.strokeStyle = '#00c853';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    if (gameSettings.planeAnimation) {
        drawAirplane(endX, endY);
    }
}

function drawAirplane(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-Math.PI / 8);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(18, 0); ctx.lineTo(-10, -6); ctx.lineTo(-4, 0); ctx.lineTo(-10, 6); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#00c853';
    ctx.beginPath();
    ctx.moveTo(2, -2); ctx.lineTo(-4, -14); ctx.lineTo(0, -14); ctx.lineTo(6, -2); ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function renderCanvasCrash() {
    ctx.fillStyle = 'rgba(230, 0, 76, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    resizeCanvas();
    updateBalanceUI();
    startRound();
}

window.onload = () => { checkSession(); };
</script>
